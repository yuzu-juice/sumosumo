name: Build Slides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-slides:
    name: Build Slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build slides
        run: npm run build:slides
      - name: Verify slides HTML was generated
        run: test -s docs/pitch/slides.html
      - name: Upload slides as artifact
        uses: actions/upload-artifact@v6
        with:
          name: slides
          path: docs/pitch/slides.html
          if-no-files-found: error
