name: Build Slides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-slides:
    name: Build Slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build slides
        run: npm run build:slides
      - name: Verify slides HTML was generated
        run: test -s docs/pitch/slides.html && test "$(grep -c '<section id=' docs/pitch/slides.html)" -ge 5
